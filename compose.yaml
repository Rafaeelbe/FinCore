
services:
  postgres:
    image: postgres:17
    container_name: fincore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fincore
      POSTGRES_USER: fincore
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - fincore_data:/var/lib/postgresql/data

volumes:
  fincore_data:
